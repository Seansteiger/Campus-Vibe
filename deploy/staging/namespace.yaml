apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    name: staging
---
apiVersion: v1
kind: Secret
metadata:
  name: campus-vibe-secrets
  namespace: staging
type: Opaque
stringData:
  database-url: "postgresql://user:pass@host:5432/db"
  redis-url: "redis://host:6379"
  jwt-secret: "change-me-in-production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: campus-vibe-config
  namespace: staging
data:
  NODE_ENV: "staging"
  CORS_ORIGINS: "https://staging.campusvibe.co.za"
