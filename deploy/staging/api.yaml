apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-vibe-api
  namespace: staging
  labels:
    app: campus-vibe-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-vibe-api
  template:
    metadata:
      labels:
        app: campus-vibe-api
    spec:
      containers:
        - name: api
          image: campus-vibe/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "staging"
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: campus-vibe-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: campus-vibe-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campus-vibe-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: campus-vibe-api
  namespace: staging
spec:
  selector:
    app: campus-vibe-api
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-vibe-api
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api-staging.campusvibe.co.za
      secretName: api-staging-tls
  rules:
    - host: api-staging.campusvibe.co.za
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campus-vibe-api
                port:
                  number: 80
